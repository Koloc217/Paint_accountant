; Paint Accountant settings.
; Copy this file to config.ini and change what you need.
; Anything left out or empty uses the default.

[server]
; Address to listen on. 0.0.0.0 = reachable from other devices on your network,
; 127.0.0.1 = only from this computer.
host = 0.0.0.0

port = 8642

; Folder for the database and photos.
; Relative paths are counted from the app folder (where run.py is).
; Absolute paths also work, e.g. /mnt/usb/paints or D:\Paints
data_dir = data

[ui]
; Interface language: auto (the browser's), ru or en. Also set in the app's Settings.
language = auto

[lookup]
; Online barcode lookup at UPCitemdb (free, no key: 100 requests a day): on or off.
; Nothing is sent by itself — only the barcode, and only when you press the button
; next to it. Also set in the app's Settings.
upcitemdb = on

; Send these requests through a proxy: socks5://127.0.0.1:1080, socks5h://… (the proxy
; also resolves the name), http://host:3128, with user:password@ if needed.
; Empty = the system's HTTPS_PROXY / ALL_PROXY variables if set, otherwise directly.
proxy =

; Or send them through a network interface, e.g. a VPN's: awg0 (Linux),
; or from that interface's own IP address (any OS). Ignored when a proxy is set above.
interface =
