; Paint Accountant settings.
; Copy this file to config.ini and change what you need.
; Anything left out or empty uses the default.

[server]
; Address to listen on. 0.0.0.0 = reachable from other devices on your network,
; 127.0.0.1 = only from this computer.
host = 0.0.0.0

port = 8642

; Folder for the database and photos.
; Relative paths are counted from the app folder (where run.py is).
; Absolute paths also work, e.g. /mnt/usb/paints or D:\Paints
data_dir = data
